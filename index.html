
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HACKER.exe</title>
<style>
*{box-sizing:border-box}
body{
 background:#050907;color:#39ff78;
 font-family:monospace;text-align:center;
 padding:25px;margin:0
}
.box{
 max-width:480px;margin:35px auto;
 padding:25px;background:#0b160e;
 border:1px solid #39ff78;
 border-radius:15px;
 box-shadow:0 0 20px #39ff7833
}
h1{font-size:35px;text-shadow:0 0 15px #39ff78}
input{
 width:100%;padding:13px;margin:9px 0;
 background:#020503;color:#39ff78;
 border:1px solid #39ff78;border-radius:7px
}
button{
 width:100%;padding:13px;margin:8px 0;
 background:#39ff78;color:#001b08;
 border:0;border-radius:7px;
 font-weight:bold;cursor:pointer
}
.option{background:#102719;color:#39ff78}
.hidden{display:none}
small{color:#9bc5a5}
</style>
</head>
<body>

<h1>HACKER.exe ☠️</h1>
<small>INTERNET SIMULATOR</small>

<div class="box" id="login">
<h2>LOGIN</h2>
<input id="username" placeholder="Email или Username">
<input id="password" type="password"
placeholder="Demo password">
<p><label>
<input type="checkbox" id="agree" style="width:auto">
Съгласявам се да участвам в демо играта.
</label></p>
<small>Използвай само измислени тестови данни.</small>
<button onclick="login()">ВХОД</button>
</div>

<div class="box hidden" id="menu">
<h2>HACKER DASHBOARD</h2>
<p>WELCOME, HACKER</p>

<button class="option" onclick="hack('Wi-Fi PASSWORD')">
📡 Wi-Fi Password Simulation
</button>

<button class="option" onclick="hack('NETWORK SCAN')">
🌐 Network Scan Simulation
</button>

<button class="option" onclick="hack('PASSWORD GENERATOR')">
🔐 Password Generator
</button>

<button class="option" onclick="hack('INTERNET CHECK')">
📶 Internet Check
</button>

<div id="progress" class="hidden">
<h3 id="status">INITIALIZING...</h3>
<h1 id="percent">0%</h1>
</div>

<div id="result" class="hidden">
<h2>ACCESS GRANTED ☠️</h2>
<p>EMAIL: totally.fake@nothing.invalid</p>
<p>PASSWORD: BANANA-404-LOL</p>
<p>🤣 JUST A MEME!</p>
</div>

<button onclick="logout()">LOGOUT</button>
</div>

<div class="box hidden" id="owner">
<h2>OWNER PANEL</h2>
<p>DEMO VISITORS</p>
<div id="visitors"></div>
<button onclick="closeOwner()">BACK</button>
</div>

<script>
function login(){
 const user=document.getElementById('username').value.trim();
 const pass=document.getElementById('password').value;
 if(!user||!pass||!document.getElementById('agree').checked){
 alert('Попълни полетата и приеми условията!');
 return;
 }

 // Записваме само username/email и час.
 // Тестовата парола не се запазва.
 let records=JSON.parse(
 localStorage.getItem('demoUsers')||'[]'
 );
 records.push({
 user:user,
 time:new Date().toLocaleString()
 });
 localStorage.setItem('demoUsers',JSON.stringify(records));

 document.getElementById('login').classList.add('hidden');
 document.getElementById('menu').classList.remove('hidden');
}

function hack(name){
 const progress=document.getElementById('progress');
 const result=document.getElementById('result');
 progress.classList.remove('hidden');
 result.classList.add('hidden');
 document.getElementById('status').textContent=name;
 let p=0;
 document.getElementById('percent').textContent='0%';

 let timer=setInterval(()=>{
 p+=10;
 document.getElementById('percent').textContent=p+'%';
 if(p>=100){
 clearInterval(timer);
 progress.classList.add('hidden');
 result.classList.remove('hidden');
 }
 },250);
}

function logout(){
 document.getElementById('menu').classList.add('hidden');
 document.getElementById('login').classList.remove('hidden');
 document.getElementById('password').value='';
}

function closeOwner(){
 document.getElementById('owner').classList.add('hidden');
 document.getElementById('login').classList.remove('hidden');
}

// Локален демонстрационен преглед.
// Не е защитен администраторски достъп.
function openOwner(){
 const pin=prompt('OWNER DEMO CODE:');
 if(pin!=='OWNER-DEMO-2026')return;
 let records=JSON.parse(
 localStorage.getItem('demoUsers')||'[]'
 );
 document.getElementById('visitors').innerHTML='';
 records.forEach(r=>{
  const div=document.createElement('p');
  div.textContent=r.user+' — '+r.time;
  document.getElementById('visitors').appendChild(div);
 });
 document.getElementById('login').classList.add('hidden');
 document.getElementById('menu').classList.add('hidden');
 document.getElementById('owner').classList.remove('hidden');
}
</script>

<!-- OWNER DEMO: натисни логото 5 пъти -->
<script>
let clicks=0;
document.querySelector('h1').addEventListener('click',()=>{
 clicks++;
 if(clicks>=5){clicks=0;openOwner();}
});
</script>
</body>
</html>
